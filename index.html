<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>IBIKA Magazine</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.magazine {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

</style>
</head>

<body>

<div class="magazine">

<img id="page"
     class="page"
     src="page1.jpg">

</div>

<script>

const pages = [
    "page1.jpg",
    "page2.jpg.JPG",
    "page3.jpg",
    "page4.jpg",
    "page5.jpg"
];

let currentPage = 0;

const page = document.getElementById("page");

let startX = 0;

document.addEventListener("touchstart", function(event) {

    startX = event.touches[0].clientX;

});

document.addEventListener("touchend", function(event) {

    const endX = event.changedTouches[0].clientX;

    const distance = startX - endX;

    // 左にスワイプ
    if (distance > 50) {

        if (currentPage < pages.length - 1) {

            currentPage++;

            page.src = pages[currentPage];

        }

    }

    // 右にスワイプ
    else if (distance < -50) {

        if (currentPage > 0) {

            currentPage--;

            page.src = pages[currentPage];

        }

    }

});

</script>

</body>
</html>
