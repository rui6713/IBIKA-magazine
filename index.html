<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

      initial-scale=1.0,

      maximum-scale=1.0,

      user-scalable=no">

<title>IBIKA Magazine</title>

<style>

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

.magazine {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;

    perspective: 1400px;

}

/* 通常のページ */

.page {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    backface-visibility: hidden;

    transform-style: preserve-3d;

    will-change: transform;

    z-index: 2;

}

/*

================================

  次のページ

================================

*/

.next {

    z-index: 1;

    transform:

        translateX(0)

        rotateY(0deg);

    transform-origin: left center;

    filter: brightness(0.92);

}

/*

================================

  ページを左へめくる

================================

*/

.turning-left {

    transform-origin: right center;

    animation:

        pageTurnLeft

        0.75s

        cubic-bezier(.35,.05,.2,1)

        forwards;

}

@keyframes pageTurnLeft {

    0% {

        transform:

            rotateY(0deg)

            scaleX(1);

        filter:

            brightness(1);

    }

    25% {

        transform:

            rotateY(-25deg)

            scaleX(.97);

        filter:

            brightness(.96);

    }

    55% {

        transform:

            rotateY(-70deg)

            scaleX(.90);

        filter:

            brightness(.82);

    }

    78% {

        transform:

            rotateY(-125deg)

            scaleX(.94);

        filter:

            brightness(.72);

    }

    100% {

        transform:

            rotateY(-180deg)

            scaleX(1);

        filter:

            brightness(.65);

    }

}

/*

================================

  ページを右へめくる

================================

*/

.turning-right {

    transform-origin: left center;

    animation:

        pageTurnRight

        0.75s

        cubic-bezier(.35,.05,.2,1)

        forwards;

}

@keyframes pageTurnRight {

    0% {

        transform:

            rotateY(0deg)

            scaleX(1);

        filter:

            brightness(1);

    }

    25% {

        transform:

            rotateY(25deg)

            scaleX(.97);

        filter:

            brightness(.96);

    }

    55% {

        transform:

            rotateY(70deg)

            scaleX(.90);

        filter:

            brightness(.82);

    }

    78% {

        transform:

            rotateY(125deg)

            scaleX(.94);

        filter:

            brightness(.72);

    }

    100% {

        transform:

            rotateY(180deg)

            scaleX(1);

        filter:

            brightness(.65);

    }

}

/*

================================

  紙っぽい影

================================

*/

.page::after {

    content: "";

    position: absolute;

    top: 0;

    bottom: 0;

    width: 8%;

    pointer-events: none;

}

</style>

</head>

<body>

<div class="magazine">

    <img id="page"

         class="page"

         src="page1.jpg">

</div>

<script>

const pages = [

    "page1.jpg",

    "page2.jpg.JPG",

    "page3.jpg.JPG",

    "page4.jpg.JPG",

    "page5.jpg.JPG"

];

let currentPage = 0;

let startX = 0;

let isTurning = false;

const magazine =

    document.querySelector(".magazine");

/*

========================

 ページをめくる

========================

*/

function changePage(direction) {

    if (isTurning) return;

    const nextIndex =

        currentPage + direction;

    if (

        nextIndex < 0 ||

        nextIndex >= pages.length

    ) {

        return;

    }

    isTurning = true;

    const current =

        document.getElementById("page");

    /*

    新しいページを作る

    */

    const next =

        document.createElement("img");

    next.src =

        pages[nextIndex];

    next.className =

        "page next";

    /*

    次のページを現在ページの下に置く

    */

    magazine.appendChild(next);

    /*

    めくる

    */

    if (direction === 1) {

        current.classList.add(

            "turning-left"

        );

    } else {

        current.classList.add(

            "turning-right"

        );

    }

    /*

    アニメーション終了

    */

    setTimeout(function() {

        current.remove();

        next.id = "page";

        next.className = "page";

        currentPage =

            nextIndex;

        isTurning = false;

    }, 750);

}

/*

========================

 スワイプ開始

========================

*/

document.addEventListener(

    "touchstart",

    function(event) {

        startX =

            event.touches[0].clientX;

    },

    { passive: true }

);

/*

========================

 スワイプ終了

========================

*/

document.addEventListener(

    "touchend",

    function(event) {

        if (isTurning) return;

        const endX =

            event.changedTouches[0].clientX;

        const distance =

            startX - endX;

        /*

        左へ

        */

        if (distance > 50) {

            changePage(1);

        }

        /*

        右へ

        */

        else if (distance < -50) {

            changePage(-1);

        }

    },

    { passive: true }

);

</script>

</body>

</html>
