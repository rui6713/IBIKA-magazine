<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

      initial-scale=1.0,

      maximum-scale=1.0,

      user-scalable=no">

<title>IBIKA Magazine</title>

<style>

/* ================================

   画面

================================ */

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

/* ================================

   本の表示場所

================================ */

#viewer {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

}

/* ================================

   現在のページ

================================ */

#page {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

}

/* ================================

   めくるページ

================================ */

#turn {

    position: absolute;

    inset: 0;

    display: none;

    transform-style: preserve-3d;

    backface-visibility: hidden;

}

/* めくるページの表 */

#turn .front {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    backface-visibility: hidden;

    user-select: none;

    -webkit-user-drag: none;

}

/* 裏側 */

#turn .back {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    backface-visibility: hidden;

}

/* ================================

   次のページへ

================================ */

.turn-left {

    display: block;

    transform-origin: left center;

    animation:

        nextPage

        0.55s

        ease-in-out

        forwards;

}

@keyframes nextPage {

    0% {

        transform: rotateY(0deg);

        filter: brightness(1);

    }

    45% {

        transform: rotateY(-75deg);

        filter: brightness(0.9);

    }

    75% {

        transform: rotateY(-135deg);

        filter: brightness(0.82);

    }

    100% {

        transform: rotateY(-180deg);

        filter: brightness(0.72);

    }

}

/* ================================

   前のページへ戻る

================================ */

.turn-right {

    display: block;

    transform-origin: right center;

    animation:

        previousPage

        0.55s

        ease-in-out

        forwards;

}

@keyframes previousPage {

    0% {

        transform: rotateY(0deg);

        filter: brightness(1);

    }

    45% {

        transform: rotateY(75deg);

        filter: brightness(0.9);

    }

    75% {

        transform: rotateY(135deg);

        filter: brightness(0.82);

    }

    100% {

        transform: rotateY(180deg);

        filter: brightness(0.72);

    }

}

</style>

</head>

<body>

<div id="viewer">

    <!-- 現在表示しているページ -->

    <img

        id="page"

        src="page1.jpg.JPEG"

        alt=""

    >

    <!-- めくっているページ -->

    <div id="turn">

        <img

            class="front"

            src=""

            alt=""

        >

        <img

            class="back"

            src=""

            alt=""

        >

    </div>

</div>

<script>

/* ================================

   写真一覧

================================ */

const pages = [

    "page1.jpg.JPEG",

    "page2.jpg.JPG",

    "page3.jpg.JPG",

    "page4.jpg.JPG",

    "page5.jpg.JPG",

    "page6.jpg.JPG",

    "page7.jpg.JPG",

    "page8.jpg.JPG",

    "page9.jpg.JPG",

    "page10.jpg.JPG",

    "page11.jpg.JPG",

    "page12.jpg.JPG",

    "page13.jpg.JPG",

    "page14.jpg.JPG",

    "page15.jpg.JPG",

    "page16.jpg.JPG",

    "page17.jpg.JPG",

    "page18.jpg.JPG",

    "page19.jpg.JPG",

    "page20.jpg.JPG",

    "page21.jpg.JPG",

    "page22.jpg.JPG",

    "page23.jpg.JPG",

    "page24.jpg.JPG",

    "page25.jpg.JPG",

    "page26.jpg.JPG"

];

let currentPage = 0;

let isTurning = false;

let startX = 0;

let startY = 0;

const page =

    document.getElementById("page");

const turn =

    document.getElementById("turn");

const front =

    turn.querySelector(".front");

const back =

    turn.querySelector(".back");

/* ================================

   ページをめくる

================================ */

function turnPage(nextPage) {

    if (isTurning) {

        return;

    }

    if (nextPage < 0) {

        return;

    }

    if (nextPage >= pages.length) {

        return;

    }

    isTurning = true;

    const oldPage =

        currentPage;

    /* めくる前のページ */

    front.src =

        pages[oldPage];

    /* めくった後のページ */

    back.src =

        pages[nextPage];

    /*

       アニメーション開始と同時に

       次の写真を表示

    */

    page.src =

        pages[nextPage];

    currentPage =

        nextPage;

    /* ================================

       次のページへ

    ================================= */

    if (nextPage > oldPage) {

        turn.className =

            "turn-left";

    }

    /* ================================

       前のページへ戻る

    ================================= */

    else {

        turn.className =

            "turn-right";

    }

    turn.style.display =

        "block";

    /* ================================

       アニメーション終了

    ================================= */

    setTimeout(function() {

        turn.style.display =

            "none";

        turn.className =

            "";

        isTurning =

            false;

    }, 570);

}

/* ================================

   指を触った場所

================================ */

document.addEventListener(

    "touchstart",

    function(event) {

        if (

            event.touches.length !== 1

        ) {

            return;

        }

        startX =

            event.touches[0].clientX;

        startY =

            event.touches[0].clientY;

    },

    {

        passive: true

    }

);

/* ================================

   指を離した場所

================================ */

document.addEventListener(

    "touchend",

    function(event) {

        if (

            event.changedTouches.length === 0

        ) {

            return;

        }

        const endX =

            event.changedTouches[0].clientX;

        const endY =

            event.changedTouches[0].clientY;

        const distanceX =

            startX - endX;

        const distanceY =

            startY - endY;

    /* 横方向のスワイプだけ反応 */

        if (

            Math.abs(distanceX) > 50 &&

            Math.abs(distanceX) >

            Math.abs(distanceY) * 1.2

        ) {

            /*

               左へスワイプ

               ↓

               次のページ

            */

            if (distanceX > 0) {

                turnPage(

                    currentPage + 1

                );

            }

            /*

               右へスワイプ

               ↓

               前のページ

            */

            else {

                turnPage(

                    currentPage - 1

                );

            }

        }

    },

    {

        passive: true

    }

);

</script>

</body>

</html>
