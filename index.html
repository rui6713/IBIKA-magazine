<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Magazine</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:sans-serif}
.book{position:relative;height:94vh;max-width:96vw;aspect-ratio:709/1536;perspective:1800px}
.page{
  position:absolute;inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.2,.7,.2,1);
  touch-action:none;
}
.page img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#fff;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.page .back{transform:rotateY(180deg)}
.page.flipped{transform:rotateY(-180deg)}
.hint{
 position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
 color:#fff;font-size:13px;opacity:.7;white-space:nowrap
}
</style>
</head>
<body>

<div class="book" id="book"></div>
<div class="hint">左右にスワイプしてページをめくる</div>

<script>
/*
  ページを増やすときは、ここに画像名を追加してください。
  例:
  "page1.jpg",
  "page2.jpg",
  "page3.jpg"
*/
const pageImages = [
  "page1.jpg"
];

const book = document.getElementById("book");

pageImages.forEach((front, i) => {
  const page = document.createElement("div");
  page.className = "page";
  page.style.zIndex = pageImages.length - i;

  const frontImg = document.createElement("img");
  frontImg.src = front;
  frontImg.alt = "ページ " + (i + 1);

  const backImg = document.createElement("img");
  backImg.className = "back";
  backImg.src = pageImages[i + 1] || front;

  page.appendChild(frontImg);
  page.appendChild(backImg);
  book.appendChild(page);
});

const pages = [...document.querySelectorAll(".page")];
let current = 0;

function nextPage(){
  if(current < pages.length){
    pages[current].classList.add("flipped");
    current++;
  }
}
function prevPage(){
  if(current > 0){
    current--;
    pages[current].classList.remove("flipped");
  }
}

let startX = 0;
book.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
}, {passive:true});

book.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  if(Math.abs(dx) < 45) return;
  if(dx < 0) nextPage();
  else prevPage();
}, {passive:true});

book.addEventListener("click", e => {
  const rect = book.getBoundingClientRect();
  if(e.clientX - rect.left > rect.width / 2) nextPage();
  else prevPage();
});
</script>
</body>
</html>
