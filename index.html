<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1.0,

maximum-scale=1.0,

user-scalable=no">

<title>IBIKA Magazine</title>

<style>

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

#viewer {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

}

#page {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

}

#turn {

    position: absolute;

    inset: 0;

    display: none;

    transform-style: preserve-3d;

    transform-origin: left center;

    backface-visibility: hidden;

    background: #111;

}

#turn img {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

}

#turn .back {

    transform: rotateY(180deg);

    backface-visibility: hidden;

}

/* 左へページをめくる */

.turn-left {

    display: block;

    animation:

    flipLeft

    0.8s

    ease-in-out

    forwards;

}

/* 右へページを戻す */

.turn-right {

    display: block;

    transform-origin: right center;

    animation:

    flipRight

    0.8s

    ease-in-out

    forwards;

}

/* 左ページめくり */

@keyframes flipLeft {

    0% {

        transform:

        rotateY(0deg);

        filter:

        brightness(1);

    }

    35% {

        transform:

        rotateY(-70deg);

        filter:

        brightness(0.88);

    }

    65% {

        transform:

        rotateY(-125deg);

        filter:

        brightness(0.80);

    }

    100% {

        transform:

        rotateY(-180deg);

        filter:

        brightness(0.72);

    }

}

/* 右ページめくり */

@keyframes flipRight {

    0% {

        transform:

        rotateY(0deg);

        filter:

        brightness(1);

    }

    35% {

        transform:

        rotateY(70deg);

        filter:

        brightness(0.88);

    }

    65% {

        transform:

        rotateY(125deg);

        filter:

        brightness(0.80);

    }

    100% {

        transform:

        rotateY(180deg);

        filter:

        brightness(0.72);

    }

}

</style>

</head>

<body>

<div id="viewer">

    <img

        id="page"

        src="page1.jpg"

        alt=""

    >

    <div id="turn">

        <img

            class="front"

            src=""

            alt=""

        >

        <img

            class="back"

            src=""

            alt=""

        >

    </div>

</div>

<script>

/*

================================

写真一覧

================================

*/

const pages = [

    "page1.jpg",

    "page2.jpg.JPG",

    "page3.jpg.JPG",

    "page4.jpg.JPG",

    "page5.jpg.JPG"

];

let currentPage = 0;

let isTurning = false;

let startX = 0;

let startY = 0;

const page =

document.getElementById("page");

const turn =

document.getElementById("turn");

const front =

turn.querySelector(".front");

const back =

turn.querySelector(".back");

/*

================================

ページをめくる

================================

*/

function turnPage(nextPage) {

    if (isTurning) {

        return;

    }

    if (nextPage < 0) {

        return;

    }

    if (nextPage >= pages.length) {

        return;

    }

    isTurning = true;

    /*

    現在のページ

    */

    front.src =

    pages[currentPage];

    /*

    めくった後のページ

    */

    back.src =

    pages[nextPage];

    /*

    次のページへ

    */

    if (nextPage > currentPage) {

        turn.className =

        "turn-left";

    }

    else {

        turn.className =

        "turn-right";

    }

    turn.style.display =

    "block";

    /*

    アニメーション終了後

    */

    setTimeout(function() {

        currentPage =

        nextPage;

        page.src =

        pages[currentPage];

        turn.style.display =

        "none";

        turn.className =

        "";

        isTurning = false;

    }, 820);

}

/*

================================

指を触った場所

================================

*/

document.addEventListener(

"touchstart",

function(event) {

    if (

        event.touches.length !== 1

    ) {

        return;

    }

    startX =

    event.touches[0].clientX;

    startY =

    event.touches[0].clientY;

},

{ passive: true }

);

/*

================================

指を離した場所

================================

*/

document.addEventListener(

"touchend",

function(event) {

    if (

        event.changedTouches.length === 0

    ) {

        return;

    }

    const endX =

    event.changedTouches[0].clientX;

    const endY =

    event.changedTouches[0].clientY;

    const distanceX =

    startX - endX;

    const distanceY =

    startY - endY;

    /*

    横方向のスワイプだけ反応

    */

    if (

        Math.abs(distanceX) > 50 &&

        Math.abs(distanceX) >

        Math.abs(distanceY) * 1.2

    ) {

        /*

        左へスワイプ

        */

        if (distanceX > 0) {

            turnPage(

                currentPage + 1

            );

        }

        /*

        右へスワイプ

        */

        else {

            turnPage(

                currentPage - 1

            );

        }

    }

},

{ passive: true }

);

</script>

</body>

</html>
